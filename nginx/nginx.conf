worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Backend API (strip /api prefix)
        location /api/ {
            proxy_pass https://backend:4000/;
            proxy_ssl_trusted_certificate /certs/ca.crt;
            proxy_ssl_verify on;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie            $http_cookie;
        }

        # Socket.io (handles /live, /game namespaces)
        location /socket.io/ {
            proxy_pass https://backend:4000;
            proxy_ssl_trusted_certificate /certs/ca.crt;
            proxy_ssl_verify on;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie            $http_cookie;

            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        # Frontend (Vite dev server + HMR)
        # Plain HTTP: Bun's node:http2 compat layer doesn't support allowHTTP1
        # fallback, so Vite's HTTPS mode breaks with nginx HTTP/1.1 proxying.
        # Traffic stays on the isolated Docker network.
        location / {
            proxy_pass http://frontend:3000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
