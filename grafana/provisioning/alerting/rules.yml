apiVersion: 1

groups:
  - orgId: 1
    name: Backend health
    folder: Alerts
    interval: 1m
    rules:
      - uid: backend-down
        title: Backend is down
        condition: threshold
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          service: transcendence-backend
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape the backend"
          description: "The backend metrics target has been unavailable for at least 2 minutes."
        data:
          - refId: backend_up
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: up{job="backend"}
              instant: true
              refId: backend_up
          - refId: threshold
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [backend_up]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "__expr__"
              expression: backend_up
              refId: threshold
              type: threshold

      - uid: backend-high-5xx-rate
        title: High HTTP 5xx error rate
        condition: threshold
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          service: transcendence-backend
          severity: critical
        annotations:
          summary: "More than 5% of backend requests are failing"
          description: "The HTTP 5xx response rate has remained above 5% for at least 5 minutes."
        data:
          - refId: error_rate
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 100 * sum(rate(http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001)
              instant: true
              refId: error_rate
          - refId: threshold
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [error_rate]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "__expr__"
              expression: error_rate
              refId: threshold
              type: threshold

      - uid: backend-high-cpu
        title: High backend CPU usage
        condition: threshold
        for: 5m
        noDataState: NoData
        execErrState: Alerting
        labels:
          service: transcendence-backend
          severity: warning
        annotations:
          summary: "Backend CPU usage is above 90%"
          description: "The Node.js process has used more than 90% of one CPU core for at least 5 minutes."
        data:
          - refId: cpu_usage
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 100 * rate(process_cpu_user_seconds_total{job="backend"}[5m])
              instant: true
              refId: cpu_usage
          - refId: threshold
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [cpu_usage]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "__expr__"
              expression: cpu_usage
              refId: threshold
              type: threshold

      - uid: backend-high-heap
        title: High backend heap usage
        condition: threshold
        for: 5m
        noDataState: NoData
        execErrState: Alerting
        labels:
          service: transcendence-backend
          severity: warning
        annotations:
          summary: "Backend heap usage is above 90%"
          description: "The Node.js heap has remained above 90% utilization for at least 5 minutes."
        data:
          - refId: heap_usage
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 100 * nodejs_heap_size_used_bytes{job="backend"} / nodejs_heap_size_total_bytes{job="backend"}
              instant: true
              refId: heap_usage
          - refId: threshold
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [heap_usage]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "__expr__"
              expression: heap_usage
              refId: threshold
              type: threshold
