services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    
    container_name: transcendence-backend
    
    ports:
      - "4000:4000"
    
    volumes:
      - ./backend:/app
      - /app/node_modules
    
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    
    container_name: transcendence-frontend
    
    ports:
      - "5173:5173"
    
    volumes:
      - ./frontend:/app
      - /app/node_modules
    
    depends_on:
      - backend
    
    restart: unless-stopped
