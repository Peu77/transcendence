services:
  nginx:
    image: nginx:alpine
    container_name: transcendence-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: transcendence-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transcendence
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql
      - ./ssl/server.crt:/tmp/certs/server.crt:ro
      - ./ssl/postgres-server.key:/tmp/certs/server.key:ro
      - ./ssl/ca.crt:/tmp/certs/ca.crt:ro
    entrypoint:
      - bash
      - -c
      - |
        cp /tmp/certs/server.key /var/lib/postgresql/server.key
        cp /tmp/certs/server.crt /var/lib/postgresql/server.crt
        cp /tmp/certs/ca.crt /var/lib/postgresql/ca.crt
        chmod 600 /var/lib/postgresql/server.key
        chown postgres:postgres /var/lib/postgresql/server.key /var/lib/postgresql/server.crt /var/lib/postgresql/ca.crt
        exec docker-entrypoint.sh "$$@"
      - --
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c ssl_ca_file=/var/lib/postgresql/ca.crt
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d transcendence" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/dev/Dockerfile
    env_file:
      - backend/dev/.env.docker
    environment:
      SSL_ENABLED: "true"
    container_name: transcendence-backend

    expose:
      - "4000"

    volumes:
      - ./backend:/app
      - ./shared:/shared
      - /app/node_modules
      - ./ssl:/certs:ro

    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('net').connect(4000,'127.0.0.1',function(){process.exit(0)}).on('error',function(){process.exit(1)})\"" ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: transcendence-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/web-config.yml:/etc/prometheus/web-config.yml:ro
      - ./ssl:/certs:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.config.file=/etc/prometheus/web-config.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: transcendence-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./ssl:/certs:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/dev/Dockerfile
    env_file:
      - frontend/dev/.env.docker
    container_name: transcendence-frontend

    expose:
      - "3000"

    volumes:
      - ./frontend:/app
      - ./shared:/shared
      - /app/node_modules

    healthcheck:
      test: [ "CMD-SHELL", "bun -e \"fetch('http://localhost:3000').then(()=>process.exit(0)).catch(()=>process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      backend:
        condition: service_started

    restart: unless-stopped

volumes:
  prometheus_data: {}
  grafana_data: {}
  postgres_data: {}
